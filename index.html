<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>推し活遠征ログ</title>
<style>
:root{--bg:#f7f6fb;--card:#fff;--text:#28253b;--muted:#777287;--line:#e8e5ef;--accent:#6d5dfc;--soft:#eeeaff;--ok:#35a46b;--bad:#df5d69;--shadow:0 6px 22px rgba(45,35,90,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:82px}
header{background:linear-gradient(135deg,#6d5dfc,#9b7cff);color:#fff;padding:18px 18px 20px;position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;opacity:.86}
main{max-width:780px;margin:auto;padding:14px}.section{font-weight:800;font-size:17px;margin:18px 3px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}.stat{font-size:24px;font-weight:800}.label,.small{font-size:12px;color:var(--muted)}.small{line-height:1.65}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.primary,.secondary,.danger,.navbtn{border:0;border-radius:11px;padding:10px 13px;font:inherit;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--accent)}.danger{background:#fff0f1;color:var(--bad)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0eef5;color:#68647a;font-size:11px;font-weight:700}.pill.ok{background:#e9f7ef;color:var(--ok)}.pill.bad{background:#fff0f1;color:var(--bad)}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.title{font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px 8px}.notice{background:var(--soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:9px;font-size:12px;margin-bottom:12px}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:5px 4px max(5px,env(safe-area-inset-bottom))}nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px 2px}nav button.active{color:var(--accent);font-weight:800}nav span{display:block;font-size:19px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(25,20,45,.45);z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:17px}.sheet h2{margin:0 0 12px;font-size:19px}label{display:block;font-size:12px;font-weight:700;color:#68647a;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#faf9fd;color:var(--text);font:inherit}textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.check input{width:auto}.bar{height:8px;background:#eeeaf5;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="推し活ログ">
<link rel="manifest" href="manifest.webmanifest">

</head>
<body>
<header><h1>推し活遠征ログ</h1><div class="sub">応募 → 当落 → 遠征 → 現場 → 思い出</div></header>
<main id="app"></main>
<nav>
<button data-tab="home" class="active"><span>⌂</span>ホーム</button>
<button data-tab="tickets"><span>🎫</span>チケット</button>
<button data-tab="trips"><span>🧳</span>遠征</button>
<button data-tab="events"><span>🎤</span>現場</button>
<button data-tab="stats"><span>📊</span>統計</button>
</nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY="oshi_trip_log_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"tickets":[],"trips":[],"events":[]}'),tab="home";
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP");
const date=d=>d?new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{year:"numeric",month:"numeric",day:"numeric"}):"";
const modal=document.getElementById("modal"),sheet=document.getElementById("sheet");
function openModal(h){sheet.innerHTML=h;modal.classList.add("show")} function closeModal(){modal.classList.remove("show")}
modal.onclick=e=>{if(e.target===modal)closeModal()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function stats(){let decided=db.tickets.filter(x=>x.result!=="未発表"),win=db.tickets.filter(x=>x.result==="当選");return{apps:db.tickets.length,win:win.length,pending:db.tickets.filter(x=>x.result==="未発表").length,rate:decided.length?win.length/decided.length*100:0}};
function pill(r){return `<span class="pill ${r==="当選"?"ok":r==="落選"?"bad":""}">${esc(r||"未発表")}</span>`}
function render(){let a=document.getElementById("app");a.innerHTML=tab==="home"?home():tab==="tickets"?tickets():tab==="trips"?trips():tab==="events"?events():statsPage();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
function home(){
 let s=stats(),today=new Date().toISOString().slice(0,10);
 let next=db.events.filter(x=>x.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
 let alerts=db.tickets.filter(x=>(x.announceDate>=today||x.applyEnd>=today)).sort((a,b)=>(a.announceDate||a.applyEnd||"").localeCompare(b.announceDate||b.applyEnd||"")).slice(0,4);
 return `<div class="section">ダッシュボード</div><div class="grid">
 <div class="card"><div class="label">チケット応募</div><div class="stat">${s.apps}</div></div>
 <div class="card"><div class="label">当選</div><div class="stat">${s.win}</div></div>
 <div class="card"><div class="label">当落待ち</div><div class="stat">${s.pending}</div></div>
 <div class="card"><div class="label">当選率</div><div class="stat">${s.rate.toFixed(1)}%</div></div></div>
 <div class="notice">このデータはこのiPhoneのブラウザ内に保存されます。自分専用の試作版です。</div>
 <div class="section">🔔 チケット予定</div><div class="card">${alerts.length?alerts.map(ticketMini).join(""):`<div class="empty">予定なし</div>`}</div>
 <div class="section">🎤 次の現場</div><div class="card">${next.length?next.map(eventMini).join(""):`<div class="empty">現場を登録してね</div>`}</div>
 <div class="actions"><button class="primary" onclick="ticketForm()">＋ チケット</button><button class="secondary" onclick="tripForm()">＋ 遠征</button><button class="secondary" onclick="eventForm()">＋ 現場</button></div>`;
}
function ticketMini(x){return `<div class="item"><div class="row"><div><div class="title">${esc(x.name)}</div><div class="small">${esc(x.artist||"")} ${x.announceDate?"・当落 "+date(x.announceDate):""} ${x.applyEnd?"・締切 "+date(x.applyEnd):""}</div></div>${pill(x.result)}</div></div>`}
function eventMini(x){return `<div class="item"><div class="title">${esc(x.name)}</div><div class="small">${date(x.date)} ・ ${esc(x.venue||"")} ・ ${esc(x.artist||"")}</div></div>`}
function tickets(){return `<div class="row"><div class="section">🎫 チケット</div><button class="primary" onclick="ticketForm()">＋追加</button></div><div class="card">${db.tickets.length?db.tickets.slice().sort((a,b)=>(a.announceDate||"").localeCompare(b.announceDate||"")).map(ticketCard).join(""):`<div class="empty">まだありません</div>`}</div>`}
function ticketCard(x){return `<div class="item"><div class="row"><div><div class="title">${esc(x.name)}</div><div class="small">${esc(x.artist||"")} ・ ${esc(x.entry||"")}<br>申込締切：${date(x.applyEnd)||"—"}　当落：${date(x.announceDate)||"—"}<br>支払期限：${date(x.payDue)||"—"}　${x.ticketPrice?yen(x.ticketPrice):""}</div></div>${pill(x.result)}</div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="editTicket('${x.id}')">編集</button><button class="danger" onclick="del('tickets','${x.id}')">削除</button></div></div>`}
function trips(){return `<div class="row"><div class="section">🧳 遠征</div><button class="primary" onclick="tripForm()">＋追加</button></div><div class="card">${db.trips.length?db.trips.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(tripCard).join(""):`<div class="empty">遠征を登録してね</div>`}</div>`}
function tripCard(x){let total=(Number(x.transport)||0)+(Number(x.hotel)||0)+(Number(x.beauty)||0)+(Number(x.ticket)||0)+(Number(x.goods)||0)+(Number(x.food)||0)+(Number(x.other)||0);return `<div class="item"><div class="title">${esc(x.name)}</div><div class="small">${date(x.start)}〜${date(x.end)} ・ ${esc(x.place||"")}<br>🚄移動 ${yen(x.transport)}　🏨宿泊 ${yen(x.hotel)}　💇美容 ${yen(x.beauty)}<br>🎫${yen(x.ticket)}　🛍${yen(x.goods)}　🍚${yen(x.food)}　その他 ${yen(x.other)}</div><div style="margin:7px 0"><b>合計 ${yen(total)}</b></div><div class="actions"><button class="secondary" onclick="editTrip('${x.id}')">編集</button><button class="secondary" onclick="todoForm('${x.id}')">＋ TODO</button><button class="danger" onclick="del('trips','${x.id}')">削除</button></div>${x.todos?.length?`<div style="margin-top:8px">${x.todos.map((t,i)=>`<label class="check"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo('${x.id}',${i})"> ${esc(t.text)}</label>`).join("")}</div>`:""}</div>`}
function events(){return `<div class="row"><div class="section">🎤 現場記録</div><button class="primary" onclick="eventForm()">＋追加</button></div><div class="card">${db.events.length?db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(eventCard).join(""):`<div class="empty">現場を登録してね</div>`}</div>`}
function eventCard(x){return `<div class="item"><div class="title">${esc(x.name)}</div><div class="small">${date(x.date)} ・ ${esc(x.artist||"")} ・ ${esc(x.venue||"")}<br>🎫${yen(x.ticketPrice)}　🛍${yen(x.goods)}　その他 ${yen(x.other)}</div>${x.memo?`<p class="small">${esc(x.memo)}</p>`:""}<div class="actions"><button class="secondary" onclick="editEvent('${x.id}')">編集</button><button class="danger" onclick="del('events','${x.id}')">削除</button></div></div>`}
function statsPage(){let s=stats(),total=db.trips.reduce((a,x)=>a+Number(x.transport||0)+Number(x.hotel||0)+Number(x.beauty||0)+Number(x.ticket||0)+Number(x.goods||0)+Number(x.food||0)+Number(x.other||0),0)+db.events.reduce((a,x)=>a+Number(x.ticketPrice||0)+Number(x.goods||0)+Number(x.other||0),0);return `<div class="section">📊 統計</div><div class="grid"><div class="card"><div class="label">現場</div><div class="stat">${db.events.length}</div><div class="small">回</div></div><div class="card"><div class="label">遠征</div><div class="stat">${db.trips.length}</div><div class="small">回</div></div><div class="card"><div class="label">当選率</div><div class="stat">${s.rate.toFixed(1)}%</div></div><div class="card"><div class="label">記録した費用</div><div class="stat" style="font-size:18px">${yen(total)}</div></div></div><div class="card"><b>当選状況</b><div class="bar"><i style="width:${Math.min(100,s.rate)}%"></i></div><div class="small" style="margin-top:7px">${s.win}当選 / ${s.apps}応募（未発表を除く当選率）</div></div>`}
function formBase(title,body,submit){openModal(`<h2>${title}</h2>${body}<div class="actions" style="margin-top:15px"><button class="primary" onclick="${submit}">保存</button><button class="secondary" onclick="closeModal()">キャンセル</button></div>`)}
function ticketForm(id=null){let x=id?db.tickets.find(a=>a.id===id):{};formBase("🎫 チケット応募",`<label>公演名</label><input id="f_name" value="${esc(x.name)}"><label>推し・出演者</label><input id="f_artist" value="${esc(x.artist)}"><label>申込先・先行</label><input id="f_entry" placeholder="FC先行 / プレイガイドなど" value="${esc(x.entry)}"><div class="three"><div><label>申込締切</label><input id="f_applyEnd" type="date" value="${x.applyEnd||""}"></div><div><label>当落発表</label><input id="f_announceDate" type="date" value="${x.announceDate||""}"></div><div><label>支払期限</label><input id="f_payDue" type="date" value="${x.payDue||""}"></div></div><div class="two"><div><label>結果</label><select id="f_result"><option>未発表</option><option>当選</option><option>落選</option></select></div><div><label>チケット代</label><input id="f_ticketPrice" type="number" value="${x.ticketPrice||""}"></div></div>`,`saveTicket('${id||""}')`);if(x.result)document.getElementById("f_result").value=x.result}
function saveTicket(id){let x=id?db.tickets.find(a=>a.id===id):{id:Date.now().toString()};Object.assign(x,{name:f_name.value,artist:f_artist.value,entry:f_entry.value,applyEnd:f_applyEnd.value,announceDate:f_announceDate.value,payDue:f_payDue.value,result:f_result.value,ticketPrice:Number(f_ticketPrice.value||0)});if(!id)db.tickets.push(x);save();closeModal();render()}
function tripForm(id=null){let x=id?db.trips.find(a=>a.id===id):{};formBase("🧳 遠征",`<label>遠征名</label><input id="t_name" placeholder="大阪遠征 11/11〜11/13" value="${esc(x.name)}"><div class="two"><div><label>開始日</label><input id="t_start" type="date" value="${x.start||""}"></div><div><label>終了日</label><input id="t_end" type="date" value="${x.end||""}"></div></div><label>行き先</label><input id="t_place" value="${esc(x.place)}"><div class="two"><div><label>🚄移動費</label><input id="t_transport" type="number" value="${x.transport||""}"></div><div><label>🏨宿泊費</label><input id="t_hotel" type="number" value="${x.hotel||""}"></div><div><label>💇美容</label><input id="t_beauty" type="number" value="${x.beauty||""}"></div><div><label>🎫チケット</label><input id="t_ticket" type="number" value="${x.ticket||""}"></div><div><label>🛍グッズ</label><input id="t_goods" type="number" value="${x.goods||""}"></div><div><label>🍚食費</label><input id="t_food" type="number" value="${x.food||""}"></div></div><label>その他</label><input id="t_other" type="number" value="${x.other||""}">`,`saveTrip('${id||""}')`)}
function saveTrip(id){let x=id?db.trips.find(a=>a.id===id):{id:Date.now().toString(),todos:[]};Object.assign(x,{name:t_name.value,start:t_start.value,end:t_end.value,place:t_place.value,transport:Number(t_transport.value||0),hotel:Number(t_hotel.value||0),beauty:Number(t_beauty.value||0),ticket:Number(t_ticket.value||0),goods:Number(t_goods.value||0),food:Number(t_food.value||0),other:Number(t_other.value||0)});if(!id)db.trips.push(x);save();closeModal();render()}
function eventForm(id=null){let x=id?db.events.find(a=>a.id===id):{};formBase("🎤 現場記録",`<label>イベント名</label><input id="e_name" value="${esc(x.name)}"><div class="two"><div><label>日付</label><input id="e_date" type="date" value="${x.date||""}"></div><div><label>推し・出演者</label><input id="e_artist" value="${esc(x.artist)}"></div></div><label>会場</label><input id="e_venue" value="${esc(x.venue)}"><div class="three"><div><label>チケット</label><input id="e_ticketPrice" type="number" value="${x.ticketPrice||""}"></div><div><label>グッズ</label><input id="e_goods" type="number" value="${x.goods||""}"></div><div><label>その他</label><input id="e_other" type="number" value="${x.other||""}"></div></div><label>感想・メモ</label><textarea id="e_memo">${esc(x.memo)}</textarea>`,`saveEvent('${id||""}')`)}
function saveEvent(id){let x=id?db.events.find(a=>a.id===id):{id:Date.now().toString()};Object.assign(x,{name:e_name.value,date:e_date.value,artist:e_artist.value,venue:e_venue.value,ticketPrice:Number(e_ticketPrice.value||0),goods:Number(e_goods.value||0),other:Number(e_other.value||0),memo:e_memo.value});if(!id)db.events.push(x);save();closeModal();render()}
function todoForm(id){let x=db.trips.find(a=>a.id===id);formBase("📝 TODOを追加",`<label>やること</label><input id="todo_text" placeholder="例：美容院を予約">`,`addTodo('${id}')`)}
function addTodo(id){let x=db.trips.find(a=>a.id===id);x.todos=x.todos||[];x.todos.push({text:todo_text.value,done:false});save();closeModal();render()}
function toggleTodo(id,i){let x=db.trips.find(a=>a.id===id);x.todos[i].done=!x.todos[i].done;save();render()}
function editTicket(id){ticketForm(id)}function editTrip(id){tripForm(id)}function editEvent(id){eventForm(id)}
function del(type,id){if(confirm("削除しますか？")){db[type]=db[type].filter(x=>x.id!==id);save();render()}}
render();
</script>
</body></html>
