<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>推し活遠征ログ</title>
<style>
:root{--bg:#f7f6fb;--card:#fff;--text:#28253b;--muted:#777287;--line:#e8e5ef;--accent:#6d5dfc;--soft:#eeeaff;--ok:#35a46b;--bad:#df5d69;--shadow:0 6px 22px rgba(45,35,90,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:82px}
header{background:linear-gradient(135deg,#6d5dfc,#9b7cff);color:#fff;padding:18px 18px 20px;position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;opacity:.86}
main{max-width:780px;margin:auto;padding:14px}.section{font-weight:800;font-size:17px;margin:18px 3px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}.stat{font-size:24px;font-weight:800}.label,.small{font-size:12px;color:var(--muted)}.small{line-height:1.65}.goods-row{padding:10px;border:1px solid var(--line);border-radius:12px;background:#faf9ff}\n.detail{background:#faf9fd;border-radius:10px;padding:9px 10px;margin-top:8px;font-size:12px;line-height:1.7}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.primary,.secondary,.danger,.navbtn{border:0;border-radius:11px;padding:10px 13px;font:inherit;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--accent)}.danger{background:#fff0f1;color:var(--bad)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0eef5;color:#68647a;font-size:11px;font-weight:700}.pill.ok{background:#e9f7ef;color:var(--ok)}.pill.bad{background:#fff0f1;color:var(--bad)}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.title{font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px 8px}.notice{background:var(--soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:9px;font-size:12px;margin-bottom:12px}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:5px 4px max(5px,env(safe-area-inset-bottom))}nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px 2px}nav button.active{color:var(--accent);font-weight:800}nav span{display:block;font-size:19px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(25,20,45,.45);z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:17px}.sheet h2{margin:0 0 12px;font-size:19px}label{display:block;font-size:12px;font-weight:700;color:#68647a;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#faf9fd;color:var(--text);font:inherit}textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.check input{width:auto}.bar{height:8px;background:#eeeaf5;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
  #printArea .printHeader{border-bottom:2px solid #6d5dfc;padding-bottom:8px;margin-bottom:14px}
  #printArea h1{font-size:22px;color:#222;margin:0 0 4px}
  #printArea h2{font-size:16px;margin:16px 0 7px;border-left:4px solid #6d5dfc;padding-left:7px}
  #printArea .printMeta{font-size:11px;color:#666}
  #printArea .printBox{border:1px solid #ddd;border-radius:8px;padding:10px;margin:7px 0}
  #printArea .printRow{font-size:11px;line-height:1.65}
  #printArea .printCost{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:3px 0;font-size:11px}
  #printArea .printTotal{font-size:15px;font-weight:800;margin-top:8px}
  #printArea .printSetlist{white-space:pre-wrap;font-size:11px;line-height:1.6}
}
#printArea{display:none}
</style>
</head>
<body>
<header><h1>推し活遠征ログ</h1><div class="sub">応募 → 当落 → 遠征 → 現場 → 思い出</div></header>
<main id="app"></main>
<nav>
<button data-tab="home" class="active"><span>⌂</span>ホーム</button>
<button data-tab="tickets"><span>🎫</span>チケット</button>
<button data-tab="trips"><span>🧳</span>遠征</button>
<button data-tab="goods"><span>🛍️</span>グッズ</button>
<button data-tab="events"><span>🎤</span>現場</button>
<button data-tab="stats"><span>📊</span>統計</button>
</nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY="oshi_trip_log_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"tickets":[],"trips":[],"events":[],"goods":[]}');
db.goods=db.goods||[];
db.goodsGroups=db.goodsGroups||[];
if(!db.goodsGroups.length && db.goods.length){
  db.goodsGroups=[{
    id:"legacy-"+Date.now(),
    title:"未分類グッズ",
    artist:"",
    memo:"以前のバージョンで登録したグッズ",
    items:db.goods.map(g=>({
      id:g.id||String(Date.now()+Math.random()),
      name:g.name||"",
      qty:Number(g.qty||1),
      unitPrice:Number(g.unitPrice||0),
      status:g.status||"購入予定",
      memo:g.memo||""
    }))
  }];
}
db.tickets=db.tickets||[]; db.trips=db.trips||[]; db.events=db.events||[];
let tab="home";
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const OSHIS=["夢追翔","小清水透","BEYOOOOONDS","OCHA NORMA","ロージークロニクル"];
function oshiSelect(id,value){return `<select id="${id}">${OSHIS.map(o=>`<option value="${esc(o)}" ${value===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`}
function oshiValue(id){return document.getElementById(id)?.value||""}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP");
const date=d=>d?new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{year:"numeric",month:"numeric",day:"numeric"}):"";
const modal=document.getElementById("modal"),sheet=document.getElementById("sheet");
function openModal(h){sheet.innerHTML=h;modal.classList.add("show")} function closeModal(){modal.classList.remove("show")}
modal.onclick=e=>{if(e.target===modal)closeModal()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function stats(){let decided=db.tickets.filter(x=>x.result!=="未発表"),win=db.tickets.filter(x=>x.result==="当選");return{apps:db.tickets.length,win:win.length,pending:db.tickets.filter(x=>x.result==="未発表").length,rate:decided.length?win.length/decided.length*100:0}};
function pill(r){return `<span class="pill ${r==="当選"?"ok":r==="落選"?"bad":""}">${esc(r||"未発表")}</span>`}
function render(){let a=document.getElementById("app");a.innerHTML=tab==="home"?home():tab==="tickets"?tickets():tab==="trips"?trips():tab==="goods"?goods():tab==="events"?events():statsPage();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
function home(){
 let s=stats(),today=new Date().toISOString().slice(0,10);
 let next=db.events.filter(x=>x.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
 let alerts=db.tickets.filter(x=>(x.announceDate>=today||x.applyEnd>=today)).sort((a,b)=>(a.announceDate||a.applyEnd||"").localeCompare(b.announceDate||b.applyEnd||"")).slice(0,4);
 return `<div class="section">ダッシュボード</div><div class="grid">
 <div class="card"><div class="label">チケット応募</div><div class="stat">${s.apps}</div></div>
 <div class="card"><div class="label">当選</div><div class="stat">${s.win}</div></div>
 <div class="card"><div class="label">当落待ち</div><div class="stat">${s.pending}</div></div>
 <div class="card"><div class="label">当選率</div><div class="stat">${s.rate.toFixed(1)}%</div></div></div>
 <div class="notice">このデータはこのiPhoneのブラウザ内に保存されます。自分専用の試作版です。</div>
 <div class="section">🔔 チケット予定</div><div class="card">${alerts.length?alerts.map(ticketMini).join(""):`<div class="empty">予定なし</div>`}</div>
 <div class="section">🎤 次の現場</div><div class="card">${next.length?next.map(eventMini).join(""):`<div class="empty">現場を登録してね</div>`}</div>
 <div class="actions"><button class="primary" onclick="ticketForm()">＋ チケット</button><button class="secondary" onclick="tripForm()">＋ 遠征</button><button class="secondary" onclick="eventForm()">＋ 現場</button></div>`;
}
function ticketMini(x){return `<div class="item"><div class="row"><div><div class="title">${esc(x.name)}</div><div class="small">${esc(x.artist||"")} ${x.announceDate?"・当落 "+date(x.announceDate):""} ${x.applyEnd?"・締切 "+date(x.applyEnd):""}</div></div>${pill(x.result)}</div></div>`}
function eventMini(x){return `<div class="item"><div class="title">${esc(x.name)}</div><div class="small">${date(x.date)} ・ ${esc(x.venue||"")} ・ ${esc(x.artist||"")}</div></div>`}
function tickets(){return `<div class="row"><div class="section">🎫 チケット</div><button class="primary" onclick="ticketForm()">＋追加</button></div><div class="card">${db.tickets.length?db.tickets.slice().sort((a,b)=>(a.announceDate||"").localeCompare(b.announceDate||"")).map(ticketCard).join(""):`<div class="empty">まだありません</div>`}</div>`}
function ticketCard(x){return `<div class="item"><div class="row"><div><div class="title">${esc(x.name)}</div><div class="small">${esc(x.artist||"")} ・ ${esc(x.entry||"")}<br>申込締切：${date(x.applyEnd)||"—"}　当落：${date(x.announceDate)||"—"}<br>支払期限：${date(x.payDue)||"—"}　${x.ticketPrice?yen(x.ticketPrice):""}</div></div>${pill(x.result)}</div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="editTicket('${x.id}')">編集</button><button class="danger" onclick="del('tickets','${x.id}')">削除</button></div></div>`}
function trips(){return `<div class="row"><div class="section">🧳 遠征</div><button class="primary" onclick="tripForm()">＋追加</button></div><div class="card">${db.trips.length?db.trips.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(tripCard).join(""):`<div class="empty">遠征を登録してね</div>`}</div>`}
function tripCard(x){
 let total=(Number(x.transport)||0)+(Number(x.hotel)||0)+(Number(x.beauty)||0)+(Number(x.ticket)||0)+(Number(x.goods)||0)+(Number(x.food)||0)+(Number(x.other)||0);
 const leg=(label,dep,arr,mode,company,number)=>dep||arr||mode||company||number?`<div class="small"><b>${label}</b> ${dep?esc(dep):"—"} → ${arr?esc(arr):"—"}　${esc(mode||"")} ${esc(company||"")} ${esc(number||"")}</div>`:"";
 const hotel=x.hotelName||x.hotelCheckin||x.hotelStation||x.hotelAddress;
 return `<div class="item"><div class="title">${esc(x.name)}</div>
 <div class="small">${date(x.start)}〜${date(x.end)} ・ ${esc(x.place||"")}<br>💜${esc(x.artist||"")}</div>
 ${leg("✈️ 往路",x.outDep,x.outArr,x.outMode,x.outCompany,x.outNumber)}
 ${leg("✈️ 復路",x.backDep,x.backArr,x.backMode,x.backCompany,x.backNumber)}
 ${hotel?`<div class="detail">🏨 <b>${esc(x.hotelName||"宿泊")}</b>${x.hotelCheckin?` ・ チェックイン ${esc(x.hotelCheckin)}`:""}${x.hotelStation?`<br>🚉 最寄駅：${esc(x.hotelStation)}`:""}${x.hotelAddress?`<br>📍 ${esc(x.hotelAddress)}`:""}</div>`:""}
 <div class="small" style="margin-top:5px">✈️交通 ${yen(x.transport)}　🏨宿泊 ${yen(x.hotel)}　💇美容 ${yen(x.beauty)}<br>🎫${yen(x.ticket)}　🛍${yen(x.goods)}　🍚${yen(x.food)}　その他 ${yen(x.other)}</div>
 <div style="margin:7px 0"><b>遠征合計 ${yen(total)}</b></div>
 <div class="actions"><button class="secondary" onclick="editTrip('${x.id}')">編集</button><button class="secondary" onclick="todoForm('${x.id}')">TODO</button><button class="primary" onclick="exportTripPdf('${x.id}')">📄 PDF</button><button class="danger" onclick="del('trips','${x.id}')">削除</button></div>
 ${(x.todos||[]).length?`<div style="margin-top:8px">${x.todos.map((t,i)=>`<div class="check"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo('${x.id}',${i})"><span style="${t.done?"text-decoration:line-through;color:#999":""}">${esc(t.text)}</span></div>`).join("")}</div>`:""}
 </div>`
}
function goods(){
 const groups=db.goodsGroups||[];
 return `<div class="row"><div class="section">🛍️ グッズ</div><button class="primary" onclick="goodsGroupForm()">＋グッズタイトルを追加</button></div>
 <div class="notice">ライブ・イベントごとのグッズタイトルをまとめて登録できます。タイトルを開くと、ペンライト・Tシャツ・アクスタなどをまとめて管理できます。</div>
 <div class="card">${groups.length?groups.map(goodsGroupCard).join(""):`<div class="empty">グッズタイトルを登録してね</div>`}</div>`
}
function goodsGroupCard(g){
 const items=g.items||[];
 const total=items.reduce((sum,i)=>sum+Number(i.qty||0)*Number(i.unitPrice||0),0);
 const planned=items.filter(i=>i.status!=="見送り").reduce((sum,i)=>sum+Number(i.qty||0)*Number(i.unitPrice||0),0);
 return `<div class="item">
   <div class="row"><div>
     <div class="title">🛍️ ${esc(g.title||"無題のグッズ")}</div>
     ${g.artist?`<div class="small">💜 ${esc(g.artist)}</div>`:""}
   </div><span class="pill">${items.length}点</span></div>
   ${g.memo?`<div class="small" style="margin-top:5px">${esc(g.memo)}</div>`:""}
   <div style="margin-top:8px">
   ${items.length?items.map((i,idx)=>{
      const cls=i.status==="購入済"?"ok":i.status==="見送り"?"bad":"";
      const line=Number(i.qty||0)*Number(i.unitPrice||0);
      return `<div class="detail" style="margin:5px 0">
        <div class="row"><div><b>${esc(i.name||"名称未入力")}</b><br><span class="small">数量 ${i.qty||0} × ${yen(i.unitPrice)} = ${yen(line)}</span></div><span class="pill ${cls}">${esc(i.status||"購入予定")}</span></div>
        ${i.memo?`<div class="small" style="margin-top:3px">${esc(i.memo)}</div>`:""}
      </div>`
   }).join(""):`<div class="small">商品がまだ登録されていません</div>`}
   </div>
   <div style="margin:8px 0"><b>合計 ${yen(total)}</b>　<span class="small">購入予定 ${yen(planned)}</span></div>
   <div class="actions"><button class="secondary" onclick="editGoodsGroup('${g.id}')">編集</button><button class="danger" onclick="delGoodsGroup('${g.id}')">削除</button></div>
 </div>`
}
function goodsGroupForm(id=null){
 const x=id?(db.goodsGroups||[]).find(a=>a.id===id):{};
 const items=(x&&x.items&&x.items.length)?x.items:[{id:String(Date.now()),name:"",qty:1,unitPrice:0,status:"購入予定",memo:""}];
 formBase("🛍️ グッズタイトル",`
 <label>グッズタイトル</label><input id="gg_title" placeholder="例：BEYOOOOONDS CONCERT 2026 グッズ" value="${esc(x?.title||"")}">
 <label>💜 推し</label>${oshiSelect("gg_artist",x?.artist||"")}
 <label>タイトルのメモ</label><input id="gg_memo" placeholder="販売期間・会場限定など" value="${esc(x?.memo||"")}">
 <div class="row" style="margin-top:12px"><b>商品一覧</b><button type="button" class="secondary" onclick="addGoodsRow()">＋商品を追加</button></div>
 <div id="goodsRows">${items.map((i,idx)=>goodsRowHtml(i,idx)).join("")}</div>
 `,`saveGoodsGroup('${id||""}')`);
}
function goodsRowHtml(i,idx){
 return `<div class="detail goods-row" data-idx="${idx}" style="margin-top:8px">
  <div class="row"><b>商品 ${idx+1}</b><button type="button" class="danger" onclick="removeGoodsRow(this)">削除</button></div>
  <label>商品名</label><input class="gr_name" placeholder="例：ペンライト" value="${esc(i.name||"")}">
  <div class="two"><div><label>数量</label><input class="gr_qty" type="number" min="1" value="${i.qty||1}"></div><div><label>1個の価格</label><input class="gr_price" type="number" min="0" value="${i.unitPrice||""}"></div></div>
  <label>ステータス</label><select class="gr_status"><option ${i.status==="購入予定"?"selected":""}>購入予定</option><option ${i.status==="購入済"?"selected":""}>購入済</option><option ${i.status==="見送り"?"selected":""}>見送り</option></select>
  <label>商品メモ</label><input class="gr_memo" placeholder="サイズ・色など" value="${esc(i.memo||"")}">
 </div>`
}
function addGoodsRow(){
 const wrap=document.getElementById("goodsRows");
 if(!wrap)return;
 const idx=wrap.querySelectorAll(".goods-row").length;
 wrap.insertAdjacentHTML("beforeend",goodsRowHtml({id:String(Date.now()+Math.random()),name:"",qty:1,unitPrice:0,status:"購入予定",memo:""},idx));
}
function removeGoodsRow(btn){
 const rows=document.querySelectorAll("#goodsRows .goods-row");
 if(rows.length<=1){alert("商品は1つ以上登録してください");return}
 btn.closest(".goods-row").remove();
 [...document.querySelectorAll("#goodsRows .goods-row")].forEach((r,i)=>r.dataset.idx=i);
}
function saveGoodsGroup(id){
 const title=document.getElementById("gg_title").value.trim();
 if(!title){alert("グッズタイトルを入力してください");return}
 let x=id?(db.goodsGroups||[]).find(a=>a.id===id):{id:String(Date.now()),items:[]};
 x.title=title;
 x.artist=document.getElementById("gg_artist").value;
 x.memo=document.getElementById("gg_memo").value;
 x.items=[...document.querySelectorAll("#goodsRows .goods-row")].map((r,i)=>({
   id:(r.dataset.id||String(Date.now()+i+Math.random())),
   name:r.querySelector(".gr_name").value.trim(),
   qty:Number(r.querySelector(".gr_qty").value||1),
   unitPrice:Number(r.querySelector(".gr_price").value||0),
   status:r.querySelector(".gr_status").value,
   memo:r.querySelector(".gr_memo").value.trim()
 })).filter(i=>i.name);
 if(!x.items.length){alert("商品を1つ以上入力してください");return}
 if(!id)db.goodsGroups.push(x);
 save();closeModal();render()
}
function editGoodsGroup(id){goodsGroupForm(id)}
function delGoodsGroup(id){
 if(!confirm("このグッズタイトルと商品一覧を削除しますか？"))return;
 db.goodsGroups=db.goodsGroups.filter(g=>g.id!==id);
 save();render()
}
function events(){return `<div class="row"><div class="section">🎤 現場記録</div><button class="primary" onclick="eventForm()">＋追加</button></div><div class="card">${db.events.length?db.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(eventCard).join(""):`<div class="empty">現場を登録してね</div>`}</div>`}
function eventCard(x){return `<div class="item"><div class="title">${esc(x.name)}</div><div class="small">${date(x.date)} ・ ${esc(x.artist||"")} ・ ${esc(x.venue||"")}${x.startTime?` ・ 開演 ${esc(x.startTime)}`:""}<br>🎫${yen(x.ticketPrice)}　🛍${yen(x.goods)}　その他 ${yen(x.other)}</div>
 ${x.venueAddress||x.venueStation?`<div class="detail">📍 ${x.venueAddress?esc(x.venueAddress):"住所未登録"}${x.venueStation?`<br>🚉 最寄駅：${esc(x.venueStation)}`:""}</div>`:""}
 ${x.seat?`<div class="small">💺 座席：${esc(x.seat)}</div>`:""}
 ${x.setlist?`<div class="detail">🎵 <b>セトリ</b><br>${esc(x.setlist).replace(/\n/g,"<br>")}</div>`:""}
 ${x.memo?`<p class="small">💭 ${esc(x.memo)}</p>`:""}
 <div class="actions"><button class="secondary" onclick="editEvent('${x.id}')">編集</button><button class="danger" onclick="del('events','${x.id}')">削除</button></div></div>`}


function statsPage(){let s=stats(),total=db.trips.reduce((a,x)=>a+Number(x.transport||0)+Number(x.hotel||0)+Number(x.beauty||0)+Number(x.ticket||0)+Number(x.goods||0)+Number(x.food||0)+Number(x.other||0),0)+db.events.reduce((a,x)=>a+Number(x.ticketPrice||0)+Number(x.goods||0)+Number(x.other||0),0);return `<div class="section">📊 統計</div><div class="grid"><div class="card"><div class="label">現場</div><div class="stat">${db.events.length}</div><div class="small">回</div></div><div class="card"><div class="label">遠征</div><div class="stat">${db.trips.length}</div><div class="small">回</div></div><div class="card"><div class="label">当選率</div><div class="stat">${s.rate.toFixed(1)}%</div></div><div class="card"><div class="label">記録した費用</div><div class="stat" style="font-size:18px">${yen(total)}</div></div></div><div class="card"><b>当選状況</b><div class="bar"><i style="width:${Math.min(100,s.rate)}%"></i></div><div class="small" style="margin-top:7px">${s.win}当選 / ${s.apps}応募（未発表を除く当選率）</div></div>`}

function printText(v){return esc(v||"—")}
function printDateTime(v){if(!v)return "—";return esc(v.replace("T"," "))}
function exportTripPdf(id){
 let x=db.trips.find(a=>a.id===id); if(!x)return;
 let total=(Number(x.transport)||0)+(Number(x.hotel)||0)+(Number(x.beauty)||0)+(Number(x.ticket)||0)+(Number(x.goods)||0)+(Number(x.food)||0)+(Number(x.other)||0);
 let related=db.events.filter(e=>e.date && x.start && x.end && e.date>=x.start && e.date<=x.end).sort((a,b)=>a.date.localeCompare(b.date));
 let todos=(x.todos||[]);
 let area=document.getElementById("printArea");
 area.innerHTML=`<div class="printHeader"><h1>推し活遠征ログ</h1><div class="printMeta">遠征記録｜${printText(x.name)}</div></div>
 <h2>🧳 遠征概要</h2><div class="printBox"><div class="printRow"><b>遠征名：</b>${printText(x.name)}</div><div class="printRow"><b>期間：</b>${printText(x.start)} ～ ${printText(x.end)}</div><div class="printRow"><b>推し：</b>${printText(x.artist)}</div><div class="printRow"><b>行き先：</b>${printText(x.place)}</div></div>
 <h2>✈️ 交通</h2><div class="printBox"><div class="printRow"><b>往路：</b>${printDateTime(x.outDep)} → ${printDateTime(x.outArr)}　${printText(x.outMode)}　${printText(x.outCompany)}　${printText(x.outNumber)}</div><div class="printRow"><b>復路：</b>${printDateTime(x.backDep)} → ${printDateTime(x.backArr)}　${printText(x.backMode)}　${printText(x.backCompany)}　${printText(x.backNumber)}</div></div>
 <h2>🏨 宿泊</h2><div class="printBox"><div class="printRow"><b>ホテル：</b>${printText(x.hotelName)}</div><div class="printRow"><b>チェックイン：</b>${printDateTime(x.hotelCheckin)}</div><div class="printRow"><b>最寄駅：</b>${printText(x.hotelStation)}</div><div class="printRow"><b>住所：</b>${printText(x.hotelAddress)}</div></div>
 <h2>💰 費用</h2><div class="printBox"><div class="printCost"><span>交通費</span><span>${yen(x.transport)}</span></div><div class="printCost"><span>宿泊費</span><span>${yen(x.hotel)}</span></div><div class="printCost"><span>美容費</span><span>${yen(x.beauty)}</span></div><div class="printCost"><span>チケット</span><span>${yen(x.ticket)}</span></div><div class="printCost"><span>グッズ</span><span>${yen(x.goods)}</span></div><div class="printCost"><span>食費</span><span>${yen(x.food)}</span></div><div class="printCost"><span>その他</span><span>${yen(x.other)}</span></div><div class="printTotal">遠征合計：${yen(total)}</div></div>
 <h2>🎤 現場記録</h2>${related.length?related.map(e=>`<div class="printBox"><div class="printRow"><b>${printText(e.name)}</b></div><div class="printRow">日付：${printText(e.date)}　開演：${printText(e.startTime)}　出演：${printText(e.artist)}</div><div class="printRow">会場：${printText(e.venue)}</div><div class="printRow">最寄駅：${printText(e.venueStation)}</div><div class="printRow">住所：${printText(e.venueAddress)}</div><div class="printRow">座席：${printText(e.seat)}</div>${e.setlist?`<div class="printRow"><b>🎵 セトリ</b></div><div class="printSetlist">${esc(e.setlist)}</div>`:""}${e.memo?`<div class="printRow"><b>感想・メモ：</b>${esc(e.memo).replace(/\n/g,"<br>")}</div>`:""}</div>`).join(""):`<div class="printBox"><div class="printRow">この遠征期間に登録された現場記録はありません。</div></div>`}
 <h2>📝 TODO</h2><div class="printBox">${todos.length?todos.map(t=>`<div class="printRow">${t.done?"☑":"☐"} ${esc(t.text)}</div>`).join(""):`<div class="printRow">TODOなし</div>`}</div>`;
 window.print();
}

render();
